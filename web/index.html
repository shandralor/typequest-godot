<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TypeQuest</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a1d10; overflow: hidden; font: 20px/1.3 "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #f3ead6; }
      /* the 3D scene owns the top region; the typing band + keyboard live in the brown band
         below it, exactly as the Godot build splits 680 / 400 of its 1080 window */
      #app { display: block; width: 100vw; height: 64vh; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #stage-mask { position: fixed; left: 0; right: 0; top: 64vh; bottom: 0; background: #2a1d10; border-top: 3px solid #6d5236; }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
      #prompt { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #9c7b56; color: #2a1d10; padding: 8px 26px; border-radius: 8px; border: 2px solid #6d5236; font-size: 22px; white-space: nowrap; }
      #bottom { position: absolute; left: 0; right: 0; top: 64vh; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 10px 0; box-sizing: border-box; }
      #band { width: min(78vw, 1100px); box-sizing: border-box; min-height: 52px; background: #b08a5c; border: 2px solid #6d5236; border-radius: 8px; padding: 12px 22px; font-size: 26px; line-height: 1.35; letter-spacing: .02em; color: #3a2a18; text-align: left; }
      #band .done { color: #1e7a3c; }
      #band .next { background: #fff2b3; color: #b43a1a; border-radius: 4px; padding: 0 2px; }
      #band .rest { color: #5a4530; }
      #score { position: absolute; right: 26px; top: 14px; font-size: 22px; color: #ffe9b8; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
      #band.reject { animation: nudge .22s ease; }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
      #message { position: absolute; top: 16%; left: 50%; transform: translateX(-50%); background: rgba(20,14,8,.85); border: 2px solid #b08a5c; border-radius: 10px; padding: 18px 28px; font-size: 26px; max-width: 70vw; text-align: center; }
      #legend { position: absolute; right: 44px; top: 32vh; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
      .pill { background: var(--c); color: #fff; padding: 8px 18px; border-radius: 8px; min-width: 200px; font-size: 24px; box-shadow: 0 2px 0 rgba(0,0,0,.35); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
      .pill b { text-decoration: underline; }
      .pill.locked { filter: grayscale(.9) brightness(.7); }
      .pill.done { filter: brightness(.88); }
      .done-tick { color: #d6ffd0; font-weight: bold; }
      .pill.hit { outline: 3px solid #fff; }
      #choices { position: absolute; right: 44px; top: 32vh; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
      .banner { background: #c0392b; color: #fff; padding: 10px 20px; border-radius: 8px; min-width: 200px; font-size: 26px; text-align: center; }
      .banner.on { background: #27ae60; }
      .banner b { text-decoration: underline; }
      /* [left finger legend] [key rows] [right finger legend], the group centred (keyboard_guide) */
      #keyboard { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 30px; }
      .kboard { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .krow { display: flex; gap: 6px; }
      .key { display: inline-block; width: 44px; height: 44px; line-height: 44px; text-align: center; background: #d9c4a1; color: #3a2a18; border-radius: 6px; border: 2px solid #8a6d4a; font-size: 22px; }
      .key.space { width: 240px; }
      /* the f/j home anchor keeps its marked label, always (A1/A8) */
      .key.anchor { color: #7a1f0a; font-weight: bold; }
      /* the lit key takes its FINGER's colour (set inline by the HUD) */
      .key.lit { color: #2b1b0c; border-color: #fff2b3; box-shadow: 0 0 0 2px rgba(255,242,179,.5); }
      /* the finger legend: five Kenney nail sprites used as CSS masks, tinted per finger */
      .hand { --hs: 0.85; width: calc(262px * var(--hs)); height: calc(138px * var(--hs)); flex: none; }
      .hand-inner { position: relative; width: 262px; height: 138px; transform: scale(var(--hs)); transform-origin: top left; }
      .nail { position: absolute; mask-size: 100% 100%; -webkit-mask-size: 100% 100%; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; transition: transform .12s ease, background .12s ease; }
      .nail-label { position: absolute; height: 18px; line-height: 18px; text-align: center; font-size: 15px; color: #d8c9b0; }
      #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(10,7,4,.55); pointer-events: auto; }
      #menu-title { font-size: 68px; letter-spacing: .04em; color: #ffe9b8; text-shadow: 0 4px 0 rgba(0,0,0,.45); }
      #totals { font-size: 20px; color: #e8d5b5; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.45); margin-top: -8px; }
      #menu-buttons { display: flex; flex-direction: column; gap: 12px; }
      #menu-buttons button { min-width: 320px; background: #9c7b56; color: #2a1d10; border: 2px solid #6d5236; border-radius: 10px; padding: 14px 26px; font-size: 26px; font-family: inherit; cursor: pointer; }
      #menu-buttons button:hover { background: #b08a5c; }
      #menu-buttons button.secondary { background: transparent; color: #e8d5b5; }
      #picker { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); text-align: center;
        background: rgba(16,11,6,.72); border: 2px solid #6d5236; border-radius: 12px; padding: 12px 34px; }
      .pick-name { font-size: 40px; color: #ffe9b8; text-shadow: 0 3px 0 rgba(0,0,0,.55); }
      .pick-hint { font-size: 20px; color: #e0cca8; margin-top: 6px; }
      #back { position: absolute; left: 20px; bottom: 20px; pointer-events: auto; background: #9c7b56; color: #2a1d10; border: 2px solid #6d5236; border-radius: 8px; padding: 8px 20px; font-size: 20px; cursor: pointer; }
      /* short viewports (laptops, 1024x600): shrink the bottom stack so the 3D scene keeps the
         frame -- at full size the band + keyboard ate ~72% of a 600px-tall window */
      @media (max-height: 820px) {
        .hand { --hs: 0.62; }
        #keyboard { gap: 18px; }
        #band { font-size: 21px; padding: 9px 16px; min-height: 40px; }
        .key { width: 34px; height: 34px; line-height: 34px; font-size: 17px; border-width: 1px; }
        .key.space { width: 180px; }
        #bottom { gap: 9px; bottom: 10px; }
        #prompt { font-size: 18px; padding: 6px 18px; }
        .pill, .banner { font-size: 19px; min-width: 150px; padding: 6px 13px; }
      }
      @media (max-height: 620px) {
        .hand { --hs: 0.45; }
        #band { font-size: 17px; padding: 6px 12px; min-height: 32px; }
        .key { width: 27px; height: 27px; line-height: 27px; font-size: 14px; border-radius: 4px; }
        .key.space { width: 140px; }
        #bottom { gap: 6px; bottom: 6px; }
        #keyboard { gap: 12px; }
        .kboard { gap: 4px; }
        .krow { gap: 4px; }
        #message { font-size: 20px; padding: 12px 18px; }
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <div id="prompt" hidden></div>
      <div id="score" hidden></div>
      <div id="message" hidden></div>
      <div id="legend" hidden></div>
      <div id="choices" hidden></div>
      <div id="bottom">
        <div id="band" hidden></div>
        <div id="keyboard"></div>
      </div>
      <button id="back" hidden>Terug</button>
      <div id="picker" hidden></div>
      <div id="menu" hidden><div id="menu-title"></div><div id="totals" hidden></div><div id="menu-buttons"></div></div>
    </div>
    <div id="fade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
