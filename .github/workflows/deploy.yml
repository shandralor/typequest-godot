name: Build and Deploy

# On every push to main: build the Three.js/Vite web app (web/) and publish it to GitHub
# Pages. The Godot tree under godot/ is reference-only since 2026-09-09 -- it is no longer
# built, exported or released here; see docs/working-context.md.
#
# Pages serves this repo on the CUSTOM DOMAIN typequest.teckhawk.be, at its ROOT -- so the
# build needs no path prefix and TQ_BASE stays unset (base "/"). If the site is ever moved
# back to the shandralor.github.io/<repo>/ subpath, set TQ_BASE to /<repo>/ on the Build
# step; the runtime already resolves every asset through it (web/src/assetPath.ts).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read the repo, write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: |
          set -euo pipefail
          npm run build
          # Pages runs Jekyll by default, which strips paths starting with an underscore
          touch dist/.nojekyll
          test -f dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # paths are workspace-relative (the working-directory default applies to `run` only)
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
